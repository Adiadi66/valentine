<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Valentine Proposal 💕</title>
    <style>
        body {
            background-color: pink;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #e60073;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
        }

        #yesBtn {
            background-color: #ff4d88;
            color: white;
        }

        #noBtn {
            background-color: #666;
            color: white;
            position: absolute;
        }

        #message {
            margin-top: 30px;
            font-size: 22px;
            color: #e60073;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Hey Ammu 💖<br>Will you be my Valentine?</h1>

    <button id="yesBtn" onclick="sayYes()">Yes 💕</button>
    <button id="noBtn" onmouseover="moveNo()">No 😜</button>

    <div id="message">
        🎉 Congrats Ammu darling! 💕<br>
        You made the best decision of your life 😘
    </div>
</div>

<script>
    function moveNo() {
        const noBtn = document.getElementById("noBtn");
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);

        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }

    function sayYes() {
        document.getElementById("message").style.display = "block";
    }
</script>

</body>
</html>
